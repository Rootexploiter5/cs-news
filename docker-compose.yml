version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 equipped with pgvector extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      # Bound to localhost for security
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net

  # ----------------------------------------------------------------------------
  # 2. Worker: Python Intelligence Ingestion & Vector Pipeline
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sentinel_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_secure_pass_2026}@db:5432/${POSTGRES_DB:-sentinel_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-900}
      SEVERITY_ALERT_THRESHOLD: ${SEVERITY_ALERT_THRESHOLD:-8}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    networks:
      - sentinel_net

  # ----------------------------------------------------------------------------
  # 3. Web: Next.js Presentation & pgvector RAG Chat Interface
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sentinel_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_secure_pass_2026}@db:5432/${POSTGRES_DB:-sentinel_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 3000
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
